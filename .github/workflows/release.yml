name: Release

# Builds the Windows and Mac installers and publishes a GitHub Release.
#
# Trigger: push a version tag that matches package.json, for example
#   git tag v0.0.2 && git push origin v0.0.2
# Full steps: docs/release-checklist.md.
#
# Signing switches on by itself when these repository secrets exist
# (docs/signing.md); with none of them, builds are unsigned (Mac: ad-hoc).
#   Mac:     CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_ENDPOINT,
#            AZURE_CODE_SIGNING_NAME, AZURE_CERT_PROFILE_NAME, AZURE_PUBLISHER_NAME
#            (or WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD for a certificate file)
#
# Security (docs/signing.md, "GitHub settings only Dave can switch on"):
# - Every job starts with a read-only token. Only create-draft and publish can
#   write to the repository, and neither installs or runs any npm package.
# - The build jobs run every dependency's code but hold only a read-only token
#   and no stored git credentials. They hand the installers to the publish job
#   as workflow artifacts; they never upload to the release themselves.
# - The publish job uses the `release` environment, so when Dave adds himself as
#   a required reviewer nothing reaches schools until he approves it.
# - Actions are pinned to full commit IDs; the version tag is in the comment.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify-version:
    name: Tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # electron-builder names the files from package.json; the tag names the
      # release. If they differ, installers land on the wrong release and every
      # installed copy is told it is up to date forever. Fail in seconds.
      - name: Compare versions
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG tag=$TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::package.json version ($PKG) does not match tag ($TAG). See docs/release-checklist.md."
            exit 1
          fi

  create-draft:
    name: Create the draft release once
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Create the release once, here, before any builder runs. Two parallel
      # electron-builder uploads once each created a release for the same tag,
      # and the empty duplicate won the download URLs. The builders no longer
      # upload at all (the publish job does), but keeping one early draft means a
      # tag with a broken build is visible on the Releases page straight away.
      # A draft is never offered to installed copies.
      - name: Create draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; reusing it."
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Locker Manager ${GITHUB_REF_NAME#v}" \
              --notes "Installers are still building. This page fills in automatically."
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: create-draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (universal)
          - os: windows-latest
            name: Windows (x64 + arm64)
    runs-on: ${{ matrix.os }}
    # Read-only: this job runs the code of about 900 npm packages.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      # No install scripts: Electron downloads its own binary when first used,
      # and electron-builder fetches what it packages. Checked 9 Oct 2026.
      - run: npm ci --ignore-scripts
      - name: Type-check and unit tests on the tagged commit
        run: npm run typecheck && npm test
      - run: npm run build

      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Unset any secret that is not configured, so electron-builder never
          # sees an empty string and tries to use it.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          EXTRA=()
          if [ -z "${CSC_LINK:-}" ]; then
            echo "No Developer ID certificate: ad-hoc signing (Apple silicon would otherwise call the app damaged)."
            EXTRA+=("-c.mac.identity=-")
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          else
            echo "Developer ID certificate found: signing, and notarising if the Apple secrets are set."
            if [ -n "${APPLE_ID:-}" ]; then EXTRA+=("-c.mac.notarize=true"); fi
          fi
          # --publish never still writes latest-mac.yml beside the installers.
          npx electron-builder --mac --publish never "${EXTRA[@]}"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_CODE_SIGNING_NAME: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
        run: |
          foreach ($v in 'WIN_CSC_LINK','WIN_CSC_KEY_PASSWORD','AZURE_TENANT_ID','AZURE_CLIENT_ID','AZURE_CLIENT_SECRET','AZURE_ENDPOINT','AZURE_CODE_SIGNING_NAME','AZURE_CERT_PROFILE_NAME','AZURE_PUBLISHER_NAME') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($v))) { Remove-Item "Env:$v" -ErrorAction SilentlyContinue }
          }
          $extra = @()
          if ($env:AZURE_CLIENT_SECRET -and $env:AZURE_ENDPOINT -and $env:AZURE_CODE_SIGNING_NAME -and $env:AZURE_CERT_PROFILE_NAME -and $env:AZURE_PUBLISHER_NAME) {
            Write-Host "Azure Artifact Signing secrets found: signing the installer."
            $extra += "-c.win.azureSignOptions.endpoint=$env:AZURE_ENDPOINT"
            $extra += "-c.win.azureSignOptions.codeSigningAccountName=$env:AZURE_CODE_SIGNING_NAME"
            $extra += "-c.win.azureSignOptions.certificateProfileName=$env:AZURE_CERT_PROFILE_NAME"
            $extra += "-c.win.azureSignOptions.publisherName=$env:AZURE_PUBLISHER_NAME"
          } elseif ($env:WIN_CSC_LINK) {
            Write-Host "Certificate file found (WIN_CSC_LINK): signing the installer."
          } else {
            Write-Host "No Windows signing secrets: the installer is unsigned (SmartScreen shows a warning on first run)."
          }
          # --publish never still writes latest.yml beside the installer.
          npx electron-builder --win --publish never @extra

      # Exactly the files the release carries (scripts/verify-release-assets.mjs
      # checks the list again after upload).
      - name: Hand the Mac files to the publish job
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-macos
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 5
      - name: Hand the Windows files to the publish job
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Upload, verify and publish
    needs: build
    runs-on: ubuntu-latest
    # Waits here for Dave's approval once the `release` environment has him as a
    # required reviewer. Nothing has been uploaded to the release before this.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      # No npm install in this job: it holds a write token. The checker and the
      # notes below use only Node itself, git and the gh command.
      - name: Collect the installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      - name: Upload the installers to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber

      # A missing latest-mac.yml breaks Mac updates silently; a wrong version in
      # latest.yml strands every installed copy. Nothing goes live until this passes.
      - name: Every expected file is on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-release-assets.mjs "$GITHUB_REF_NAME"

      - name: Write release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          PREV=$(git tag --sort=-v:refname | grep '^v' | grep -v "^${TAG}$" | head -n1 || true)
          RANGE=""
          if [ -n "$PREV" ]; then RANGE="${PREV}..${TAG}"; fi
          strip() { sed -E 's/^[a-z]+(\([^)]*\))?!?: //'; }
          section() { # $1 heading, $2 grep pattern
            local lines
            lines=$(git log $RANGE --no-merges --pretty=format:'%s' | grep -iE "$2" | grep -viE 'CLAUDE\.md|\.claude|release\):' | strip || true)
            if [ -n "$lines" ]; then
              printf '### %s\n\n' "$1"
              printf '%s\n' "$lines" | sed 's/^/- /'
              printf '\n'
            fi
          }
          {
            section "New" '^(feat|add)'
            section "Fixed" '^fix'
            section "Documentation" '^docs'
            section "Build and packaging" '^(build|chore|ci)'
          } > /tmp/changelog.md
          if [ ! -s /tmp/changelog.md ]; then printf -- '- Minor improvements.\n' > /tmp/changelog.md; fi

          HIGHLIGHTS="docs/release-highlights/v${VERSION}.md"
          if [ -f "$HIGHLIGHTS" ]; then
            { cat "$HIGHLIGHTS"; printf '\n<details><summary>Every change</summary>\n\n'; cat /tmp/changelog.md; printf '\n</details>\n'; } > /tmp/whatsnew.md
          else
            cp /tmp/changelog.md /tmp/whatsnew.md
          fi

          sed -e "s|{{VERSION}}|${VERSION}|g" -e "s|{{REPO}}|${REPO}|g" .github/release-notes-template.md > /tmp/notes.md
          awk -v f=/tmp/whatsnew.md '/\{\{WHATS_NEW\}\}/ { while ((getline line < f) > 0) print line; next } { print }' /tmp/notes.md > /tmp/notes-final.md

          # Milestone builds (0.x) and beta suffixes are GitHub pre-releases.
          if [[ "$VERSION" == 0.* || "$VERSION" == *-* ]]; then PRE="--prerelease"; else PRE="--prerelease=false --latest"; fi
          gh release edit "$TAG" --repo "$REPO" --title "Locker Manager ${VERSION}" --notes-file /tmp/notes-final.md --draft=false $PRE
          echo "Published https://github.com/${REPO}/releases/tag/${TAG}"
